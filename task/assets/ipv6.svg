<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="430" viewBox="0 0 1400 430"><rect width="1400" height="430" fill="white"/><style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#202124}.n{fill:#fff;stroke:#5f6368;stroke-width:3}.l{stroke:#747b83;stroke-width:5}.h{font-size:30px;font-weight:700}.t{font-size:22px;font-weight:700}.s{font-size:17px;fill:#5f6368}</style><text class="h" x="700" y="55" text-anchor="middle">IPv6 LAN: link-local + global /64 + NDP</text><line class="l" x1="390" y1="210" x2="1010" y2="210"/><rect class="n" x="120" y="135" width="270" height="150" rx="22"/><rect class="n" x="1010" y="135" width="270" height="150" rx="22"/><text class="t" x="255" y="190" text-anchor="middle">pc1</text><text class="s" x="255" y="225" text-anchor="middle">2001:db8:9::10/64</text><text class="t" x="1145" y="190" text-anchor="middle">pc2</text><text class="s" x="1145" y="225" text-anchor="middle">2001:db8:9::20/64</text><text class="s" x="700" y="180" text-anchor="middle">Neighbor Solicitation → solicited-node multicast</text><text class="s" x="700" y="255" text-anchor="middle">Neighbor Advertisement → MAC mapping</text><text class="s" x="700" y="355" text-anchor="middle">NDP является частью ICMPv6; отдельного ARP в IPv6 нет.</text></svg>